name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Адрес нашего сервера (синхронизация и push)
          VITE_API_BASE: ${{ vars.API_BASE }}
          # Запасной вход через посредника на Cloudflare: через часть VPN сервер в России не открывается
          VITE_API_FALLBACK: https://pp-tg-relay.pixel-planner.workers.dev
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Сервер: собранный файл уходит на VPS по ключу, который умеет только принять сборку и перезапустить службу
  # (настройка — server-node/setup-autodeploy.sh). Идёт только после успешных проверок; если сервер не изменился,
  # перезапуска нет; если новая сборка не поднялась, сервер сам возвращает прежнюю.
  server:
    needs: build
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    concurrency:
      group: server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:node
      - name: Выкладка на сервер
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -cf - -C server-node/dist server.mjs backup.mjs | ssh -i ~/.ssh/deploy -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ConnectionAttempts=3 "ppdeploy@$DEPLOY_HOST"
          rm -f ~/.ssh/deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
